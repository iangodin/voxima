# Builds the manual (make docs), checks that the committed doc/html is what that gives, and can publish it to GitHub
# Pages. It runs only when started by hand: Actions tab, Docs, Run workflow (tick "Publish" to deploy), or
# `gh workflow run docs.yml -f publish=true`.
#
# Once, in the repository's Settings, Pages: set the Source to "GitHub Actions".
name: Docs

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the manual to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: doc/requirements.txt

      - run: python -m pip install -r doc/requirements.txt

      # --strict makes a broken link or a missing snippet an error
      - name: Build the manual
        run: make docs
        env:
          NO_MKDOCS_2_WARNING: "1"

      # doc/html is committed (and installed with the package): it must be what the sources give
      - name: Check that doc/html is up to date
        run: |
          if [ -n "$(git status --porcelain -- doc/html)" ]; then
            git status --short -- doc/html
            echo "::error::doc/html is out of date: run make docs and commit the result"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        if: inputs.publish
        with:
          path: doc/html

  deploy:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
