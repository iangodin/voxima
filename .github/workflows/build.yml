# Builds and tests Voxima on Linux, Windows and macOS. It runs only when started by hand (the "Run workflow" button of
# the Actions tab, or `gh workflow run build.yml -f platforms=macos`), not on every commit.
name: Build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to build
        type: choice
        options: [all, linux, windows, macos, linux-cuda]
        default: all

jobs:
  # Which platforms to build (a job's own `if` cannot see its matrix, so the matrix is made here)
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          all='[
            {"name": "linux",      "os": "ubuntu-24.04", "cache": "linux"},
            {"name": "windows",    "os": "windows-2022", "cache": "windows"},
            {"name": "macos",      "os": "macos-14",     "cache": "macos"},
            {"name": "linux-cuda", "os": "ubuntu-24.04", "cache": "linux", "cuda": true}
          ]'
          matrix=$(jq -c --arg p "$PLATFORMS" '{include: [.[] | select($p == "all" or $p == .name)]}' <<< "$all")
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Voxima is built with make, which drives CMake, Ninja and Conan (see AGENTS.md)
      - name: Install the tools
        shell: bash
        run: python -m pip install conan cmake ninja

      - name: Install make (Windows)
        if: matrix.name == 'windows'
        shell: bash
        run: choco install make -y --no-progress

      - name: Install GCC 14 (Linux)
        if: startsWith( matrix.name, 'linux' )
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      # So that Ninja finds cl, link and the Windows SDK
      - name: Set up the MSVC environment (Windows)
        if: matrix.name == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      # nvcc, the runtime and cuBLAS, from NVIDIA's repository. 12.9, the first with GCC 14 as a host compiler
      # (VOXIMA_TTS_CUDA finds nvcc in /usr/local/cuda)
      - name: Install the CUDA toolkit
        if: matrix.cuda
        shell: bash
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y cuda-nvcc-12-9 cuda-cudart-dev-12-9 cuda-cccl-12-9 libcublas-dev-12-9
          sudo ln -sfn /usr/local/cuda-12.9 /usr/local/cuda
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"

      - name: Set up Conan
        shell: bash
        run: |
          conan profile detect --force
          python - <<'PY'
          import pathlib, subprocess
          path = pathlib.Path(subprocess.check_output(["conan", "profile", "path", "default"], text=True).strip())
          lines = path.read_text().splitlines()
          # Voxima is C++20
          out = []
          for line in lines:
              if line.startswith("compiler.cppstd="):
                  continue
              out.append(line)
              if line.startswith("compiler.version="):
                  out.append("compiler.cppstd=20")
          out += [
              "",
              "[conf]",
              "tools.cmake.cmaketoolchain:generator=Ninja",
              # The libraries' own build dependencies (SDL's X11 headers, say) come from the system's packages
              "tools.system.package_manager:mode=install",
              "tools.system.package_manager:sudo=True",
          ]
          path.write_text("\n".join(out) + "\n")
          print(path.read_text())
          PY

      # The Conan packages (the libraries, built from source the first time) are what takes the time. They are restored
      # here, and saved after the configure step (see below), which is when they are all there.
      - name: Restore the Conan packages
        id: conan-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.cache }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ matrix.cache }}-${{ hashFiles('conanfile.py') }}-
            conan-${{ matrix.cache }}-

      # The libraries, then the Debug and Release builds
      - name: Configure
        if: ${{ !matrix.cuda }}
        shell: bash
        run: make config

      - name: Configure (CUDA)
        if: matrix.cuda
        shell: bash
        run: make config CMAKE_ARGS=-DVOXIMA_TTS_CUDA=ON

      # Saved now, not at the end of the job (where actions/cache would only save if every step had passed, so a build that
      # fails, as a new platform's does, would never keep the libraries it took an hour to build). Without the sources and
      # build folders, which are most of it and not needed again. Only if there was no cache for this conanfile: one that
      # exists cannot be written over, so a failed configure saves what it got to under another name, which the next
      # run starts from.
      - name: Clean the Conan cache
        if: always() && steps.conan-cache.outputs.cache-hit != 'true'
        shell: bash
        run: conan cache clean "*" --source --build --download --temp

      - name: Save the Conan packages
        if: success() && steps.conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.cache }}-${{ hashFiles('conanfile.py') }}

      - name: Save the Conan packages so far
        if: failure() && steps.conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.cache }}-${{ hashFiles('conanfile.py') }}-partial-${{ github.run_id }}

      - name: Build
        shell: bash
        run: make

      # The tests set text, so they need the fonts (not in the repository, about 450 MB). Kept in the cache, and fetched
      # again only when download_fonts.py changes.
      - name: Restore the fonts
        id: fonts-cache
        if: ${{ !matrix.cuda }}
        uses: actions/cache/restore@v4
        with:
          path: assets/fonts
          key: fonts-${{ runner.os }}-${{ hashFiles('download_fonts.py') }}

      - name: Download the fonts
        if: ${{ !matrix.cuda && steps.fonts-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          python -m pip install requests
          python download_fonts.py

      - name: Save the fonts
        if: ${{ !matrix.cuda && steps.fonts-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: assets/fonts
          key: ${{ steps.fonts-cache.outputs.cache-primary-key }}

      # Builds the Debug build, and runs the tests
      - name: Test
        if: ${{ !matrix.cuda }}
        shell: bash
        run: make test

      # The examples are built with Voxima: check that they load and can be listed
      - name: List the examples' scenes
        if: ${{ !matrix.cuda }}
        shell: bash
        run: build/Release/voxima --plugin-dir build/Release/plugins --list-scenes

      - name: Install
        if: ${{ !matrix.cuda }}
        shell: bash
        run: make install PREFIX="$RUNNER_TEMP/voxima-install"
